{% if page_obj.has_other_pages %}<nav class="pagination-bar" aria-label="Pagination"><span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} <span class="text-muted">· {{ page_obj.paginator.count }} results</span></span><div class="pagination-actions">{% if page_obj.has_previous %}<a class="btn btn-outline-secondary btn-sm" href="?page={{ page_obj.previous_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}{% if decision %}&amp;decision={{ decision|urlencode }}{% endif %}">← Previous</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-outline-secondary btn-sm" href="?page={{ page_obj.next_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}{% if decision %}&amp;decision={{ decision|urlencode }}{% endif %}">Next →</a>{% endif %}</div></nav>{% endif %}
