name: access-granted
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-access_granted}
      POSTGRES_USER: ${POSTGRES_USER:-access_granted}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/start.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  policy:
    build: ./policy_service
    environment:
      POLICY_API_KEY: ${POLICY_API_KEY:?Run scripts/start.sh first}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run scripts/start.sh first}
      POSTGRES_DB: ${POSTGRES_DB:-access_granted}
      POSTGRES_USER: ${POSTGRES_USER:-access_granted}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POLICY_URL: http://policy:8001
      POLICY_API_KEY: ${POLICY_API_KEY}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-LearnTogether2026!}
    ports:
      - '127.0.0.1:${APP_PORT:-8000}:8000'
    volumes:
      - private_media:/app/private_media
    depends_on:
      db:
        condition: service_healthy
      policy:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
  private_media:
